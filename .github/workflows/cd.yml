name: CD Pipeline (Container Publish & Cloud Deployment)

"on":
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build & Publish Container to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────
  publish-container:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Trigger Cloud Deployment (Render / Webhook)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Continuous Deployment to Cloud
    needs: publish-container
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Deployment via Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "🚀 Triggering cloud deployment on Render via Deploy Hook..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_HOOK")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Deployment triggered successfully! (HTTP $HTTP_CODE)"
            else
              echo "⚠️ Deploy hook returned HTTP status: $HTTP_CODE"
            fi
          else
            echo "ℹ️ INFO: 'RENDER_DEPLOY_HOOK_URL' secret is not configured in repository secrets."
            echo "➡️ If you want automatic zero-downtime deployment on Render:"
            echo "   1. Open your Render Web Service dashboard"
            echo "   2. Copy the 'Deploy Hook' URL under Settings"
            echo "   3. Add it to GitHub: Settings -> Secrets and variables -> Actions -> RENDER_DEPLOY_HOOK_URL"
            echo "ℹ️ The Docker container was still successfully built and published to GHCR!"
          fi

      - name: Deployment Job Summary
        run: |
          echo "### 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: GitHub Container Registry (GHCR)" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "- **Live Deployment Status**: 🚀 Deployed via Webhook" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Live Deployment Status**: 📦 Image ready in GHCR (Add RENDER_DEPLOY_HOOK_URL secret for auto-deploy)" >> $GITHUB_STEP_SUMMARY
          fi
